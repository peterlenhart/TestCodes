<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metallwand Scene - Korrekt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000000;
      overflow: hidden;
      touch-action: none;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }

    #container { 
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 100vh;
    }

    #container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // =========================
    // Scene Setup
    // =========================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3f1a14); // Mahagoni schwarz-rot-braun

    const containerWidth = 360;
    const containerHeight = 720;
    
    // PERSPEKTIVKAMERA für realistischen Fluchtpunkt
    const camera = new THREE.PerspectiveCamera(
      50,
      containerWidth / containerHeight,
      0.01,
      100
    );
    
    // FIXIERTE Kamera: 85° Draufsicht
    const baseY = 2.143;
    const verticalAngle = -1.0;
    const horizontal = 0;
    const radius = 1.6;
    
    camera.position.set(
      0 + Math.sin(horizontal) * 0.5,
      baseY + radius * Math.sin(-verticalAngle),
      radius * Math.cos(verticalAngle) + Math.cos(horizontal) * 0.3
    );
    
    const lookAtBlend = Math.max(0, Math.min(1, (verticalAngle + 0.7) / 0.4));
    const lookAtY = 0.234375 + (0.46875 - 0.234375) * (1 - lookAtBlend);
    const lookAtZ = 0.7 + (0.421875 - 0.7) * lookAtBlend;
    
    camera.lookAt(0, lookAtY, lookAtZ);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(360, 720);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    // SCHATTEN AKTIVIEREN
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    
    document.getElementById('container').appendChild(renderer.domElement);

    // =========================
    // BELEUCHTUNG
    // =========================
    // Ambiente Grundbeleuchtung
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    // HAUPTLICHT mit Schatten
    // Position: 3 Zellen -Z, 1 Zelle -X, Höhe 1300mm
    // 3 Zellen = 0.46875, 1 Zelle = 0.15625, 1300mm = 8.708 Einheiten
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
    mainLight.position.set(-0.15625, 8.708, -0.46875);
    mainLight.castShadow = true;
    
    // Schatten-Qualität
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.camera.near = 0.1;
    mainLight.shadow.camera.far = 20;
    mainLight.shadow.camera.left = -3;
    mainLight.shadow.camera.right = 3;
    mainLight.shadow.camera.top = 3;
    mainLight.shadow.camera.bottom = -3;
    
    scene.add(mainLight);

    // Zusätzliches Fill-Light (weicher, kein Schatten)
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.2);
    fillLight.position.set(1, 3, 1);
    scene.add(fillLight);

    // =========================
    // TISCH (π1 Ebene) mit Schatten-Empfang
    // =========================
    const tableGeometry = new THREE.PlaneGeometry(5, 5);
    const tableMaterial = new THREE.MeshStandardMaterial({
      color: 0x2a1810,
      roughness: 0.8,
      metalness: 0.1
    });
    const table = new THREE.Mesh(tableGeometry, tableMaterial);
    table.rotation.x = -Math.PI / 2; // Horizontal
    table.position.y = 0; // Auf π1
    table.receiveShadow = true; // Empfängt Schatten
    scene.add(table);

    // =========================
    // 3D GRID auf π1
    // =========================
    // Grid: 16×16 Zellen für volle Sichtbarkeit
    const gridSize = 16 * 0.15625; // 2.5 Einheiten
    const gridDivisions = 16;
    
    // Grid auf π1 (Y=0) - 1.5 Zellen nach Norden verschoben
    const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0xff8800, 0xff8800);
    gridHelper.position.y = 0.001; // Minimal über π1
    gridHelper.position.z = 0.421875; // 1.5 Zellen nach Norden
    gridHelper.material.opacity = 0.3;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);
    
    // ZUSÄTZLICHES Grid 3 Zellen über π1 (Y=0.46875) - 1.5 Zellen nach Norden
    const gridHelper2 = new THREE.GridHelper(gridSize, gridDivisions, 0xffffff, 0x888888);
    gridHelper2.position.y = 0.46875; // 3 Zellen über π1
    gridHelper2.position.z = 0.421875; // 1.5 Zellen nach Norden
    gridHelper2.material.opacity = 0.3;
    gridHelper2.material.transparent = true;
    scene.add(gridHelper2);

    // =========================
    // ACHSEN (X und Z)
    // =========================
    // Orange Material für Achsen auf π1
    const axesMaterialPi1 = new THREE.LineBasicMaterial({ 
      color: 0xff8800, 
      linewidth: 2,
      opacity: 0.9,
      transparent: true
    });
    
    // Weißes Material für Achsen 3 Zellen über π1
    const axesMaterial = new THREE.LineBasicMaterial({ 
      color: 0xffffff, 
      linewidth: 2,
      opacity: 0.9,
      transparent: true
    });

    // X-Achse auf π1 (Y=0.002) - zwischen Gridzeile 6 und 7, 1.5 Zellen nach Norden
    const xAxisGeometry1 = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-2.5, 0.002, 0.109375),
      new THREE.Vector3(2.5, 0.002, 0.109375)
    ]);
    const xAxis1 = new THREE.Line(xAxisGeometry1, axesMaterialPi1);
    scene.add(xAxis1);

    // Z-Achse auf π1 (Y=0.002) - ORANGE
    const zAxisGeometry1 = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0.002, -2.5),
      new THREE.Vector3(0, 0.002, 2.5)
    ]);
    const zAxis1 = new THREE.Line(zAxisGeometry1, axesMaterialPi1);
    scene.add(zAxis1);

    // ZUSÄTZLICHE X-Achse 3 Zellen über π1 (Y=0.46875) - 1.5 Zellen nach Norden
    const xAxisGeometry2 = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-2.5, 0.46875, 0.109375),
      new THREE.Vector3(2.5, 0.46875, 0.109375)
    ]);
    const xAxis2 = new THREE.Line(xAxisGeometry2, axesMaterial);
    scene.add(xAxis2);

    // ZUSÄTZLICHE Z-Achse 3 Zellen über π1 (Y=0.46875)
    const zAxisGeometry2 = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0.46875, -2.5),
      new THREE.Vector3(0, 0.46875, 2.5)
    ]);
    const zAxis2 = new THREE.Line(zAxisGeometry2, axesMaterial);
    scene.add(zAxis2);

    // =========================
    // WAND
    // =========================
    const wallGeometry = new THREE.BoxGeometry(
      0.9375,   // 6 Zellen breit
      0.46875,  // 3 Zellen hoch
      0.0335    // 5mm dick
    );
    
    // Silbergrau RGB(192, 192, 192)
    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0xc0c0c0,
      metalness: 0.7,
      roughness: 0.3
    });
    
    const wall = new THREE.Mesh(wallGeometry, wallMaterial);
    wall.position.set(0, 0.234375, 0.597125);  // 1.5 Zellen nach Norden verschoben
    wall.castShadow = true;
    wall.receiveShadow = true;
    scene.add(wall);

    // =========================
    // ZWEITE WAND (Südfläche exakt 3 Zellen vom Achsmittelpunkt in -Z) - 1.5 Zellen nach Norden
    // =========================
    const wall2 = new THREE.Mesh(wallGeometry, wallMaterial);
    wall2.position.set(0, 0.234375, -0.376125);  // 1.5 Zellen nach Norden verschoben
    wall2.castShadow = true;
    wall2.receiveShadow = true;
    scene.add(wall2);

    // =========================
    // SEITENWÄNDE (parallel zur Z-Achse)
    // =========================
    // Länge: 1.00675 (von Nordfläche -0.15850 bis Südfläche 0.84825)
    const sideWallGeometry = new THREE.BoxGeometry(
      0.0335,   // Wandstärke 5mm
      0.46875,  // 3 Zellen hoch
      1.00675   // Exakte Länge für bündige Außenflächen
    );
    
    // Linke Wand (-X, 3 Zellen) - Innenfläche bei -0.46875, 1.5 Zellen nach Norden
    const wallLeft = new THREE.Mesh(sideWallGeometry, wallMaterial);
    wallLeft.position.set(-0.48550, 0.234375, 0.1105);  // 1.5 Zellen nach Norden
    wallLeft.castShadow = true;
    wallLeft.receiveShadow = true;
    scene.add(wallLeft);
    
    // Rechte Wand (+X, 3 Zellen) - Innenfläche bei +0.46875, 1.5 Zellen nach Norden
    const wallRight = new THREE.Mesh(sideWallGeometry, wallMaterial);
    wallRight.position.set(0.48550, 0.234375, 0.1105);  // 1.5 Zellen nach Norden
    wallRight.castShadow = true;
    wallRight.receiveShadow = true;
    scene.add(wallRight);

    // =========================
    // WÜRFEL (3 Zellen Kantenlänge)
    // =========================
    const cubeSize = 0.46875; // 3 Zellen = 70mm
    const cubeGeometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
    const cubeMaterial = new THREE.MeshStandardMaterial({
      color: 0xff0000,
      metalness: 0.3,
      roughness: 0.7
    });
    
    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
    
    // WÜRFEL AUF ECKE AM URSPRUNG (0, 0, 0)
    // Bottom-Nord-Ost-Ecke bei (0,0,0), Körperdiagonale vertikal
    // Zentrum bei (0, a√3/2, 0)
    
    const offset = cubeSize / 2; // 0.234375
    const centerHeight = cubeSize * Math.sqrt(3) / 2; // ≈ 0.406
    
    // PIVOT GROUP am Ursprung (0, 0, 0)
    const pivotGroup = new THREE.Group();
    pivotGroup.position.set(0, 0, 0);
    scene.add(pivotGroup);
    
    // Würfel relativ zum Pivot (Zentrum bei 0, centerHeight, 0)
    cube.position.set(0, centerHeight, 0);
    cube.rotation.set(Math.atan(Math.sqrt(2)), Math.PI / 4, 0);
    
    console.log('Würfel auf Ecke - Zentrum Y:', centerHeight.toFixed(3));
    
    cube.castShadow = true;
    cube.receiveShadow = true;
    pivotGroup.add(cube);
    
    // =========================
    // 3×3 GRID-LINIEN auf Würfel-Faces
    // =========================
    const gridLineMaterial = new THREE.LineBasicMaterial({ 
      color: 0x000000, 
      linewidth: 2,
      transparent: true,
      opacity: 0.4
    });
    
    const third = cubeSize / 3; // Ein Drittel der Kantenlänge
    const half = cubeSize / 2;
    
    // Funktion: Erstelle 3×3 Grid auf einer Face
    function createFaceGrid(normal, up) {
      const gridGroup = new THREE.Group();
      
      // 2 horizontale Linien
      for (let i = 1; i <= 2; i++) {
        const y = -half + i * third;
        const points = [
          new THREE.Vector3(-half, y, 0),
          new THREE.Vector3(half, y, 0)
        ];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, gridLineMaterial);
        gridGroup.add(line);
      }
      
      // 2 vertikale Linien
      for (let i = 1; i <= 2; i++) {
        const x = -half + i * third;
        const points = [
          new THREE.Vector3(x, -half, 0),
          new THREE.Vector3(x, half, 0)
        ];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, gridLineMaterial);
        gridGroup.add(line);
      }
      
      // Rotiere Grid zur richtigen Face
      gridGroup.lookAt(normal);
      gridGroup.position.copy(normal.multiplyScalar(half + 0.001)); // Leicht über Face
      
      return gridGroup;
    }
    
    // Erstelle Grid auf allen 6 Faces
    const faces = [
      { normal: new THREE.Vector3(0, 0, 1), up: new THREE.Vector3(0, 1, 0) },   // Front
      { normal: new THREE.Vector3(0, 0, -1), up: new THREE.Vector3(0, 1, 0) },  // Back
      { normal: new THREE.Vector3(1, 0, 0), up: new THREE.Vector3(0, 1, 0) },   // Right
      { normal: new THREE.Vector3(-1, 0, 0), up: new THREE.Vector3(0, 1, 0) },  // Left
      { normal: new THREE.Vector3(0, 1, 0), up: new THREE.Vector3(0, 0, -1) },  // Top
      { normal: new THREE.Vector3(0, -1, 0), up: new THREE.Vector3(0, 0, 1) }   // Bottom
    ];
    
    faces.forEach(face => {
      const grid = createFaceGrid(face.normal.clone(), face.up);
      cube.add(grid);
    });
    
    console.log('3×3 Grid auf allen Faces erstellt');
    
    // Tracking der Rotationen (wird nicht mehr gebraucht)
    // let currentYRotation = 0;

    // =========================
    // OBERE OSTKANTE (deaktiviert für Eckstand)
    // =========================
    /*
    const edgeGeometry = new THREE.CylinderGeometry(0.008, 0.008, cubeSize, 8);
    const edgeMaterial = new THREE.MeshStandardMaterial({
      color: 0x00ff00, // Grün
      metalness: 0.5,
      roughness: 0.3,
      emissive: 0x00ff00,
      emissiveIntensity: 0.3
    });
    
    const upperEastEdge = new THREE.Mesh(edgeGeometry, edgeMaterial);
    upperEastEdge.rotation.x = Math.PI / 2; // Horizontal in Z-Richtung
    upperEastEdge.position.set(
      0,                          // X = 0 (auf Z-Achse)
      0.46875,                    // Y = oben
      0.109375 + cubeSize / 2     // Z = Mitte der Ostkante
    );
    scene.add(upperEastEdge);
    */

    // =========================
    // URSPRUNGS-MARKER (0, 0, 0)
    // =========================
    const originMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.02, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffff00 })
    );
    originMarker.position.set(0, 0.005, 0);
    scene.add(originMarker);
    console.log('Gelber Marker am Ursprung (0, 0, 0)');



    // =========================
    // ECKSTAND-STEUERUNG: Live-Neigung folgt Fingerbewegung
    // =========================
    let isTouching = false;
    let touchStartY = 0;
    let currentTilt = 0; // Aktuelle Neigung (0° bis 40°)
    const maxTilt = 40 * Math.PI / 180; // 40° in Radiant
    const tiltSensitivity = 0.003; // Erhöhte Empfindlichkeit
    
    renderer.domElement.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      touchStartY = touch.clientY;
      isTouching = true;
    });
    
    renderer.domElement.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      e.preventDefault();
      
      const touch = e.touches[0];
      const deltaY = touch.clientY - touchStartY;
      
      // deltaY > 0: nach unten (Süden) → Neigung erhöhen
      // deltaY < 0: nach oben (Norden) → Neigung verringern
      const tiltChange = deltaY * tiltSensitivity;
      currentTilt = Math.max(0, Math.min(maxTilt, currentTilt + tiltChange));
      
      // Neigung direkt anwenden
      pivotGroup.rotation.x = currentTilt;
      
      // Aktualisiere Start-Position für nächstes Frame
      touchStartY = touch.clientY;
    });
    
    renderer.domElement.addEventListener('touchend', () => {
      isTouching = false;
    });

    // TOUCH/MOUSE CONTROLS - DEAKTIVIERT (Kipp-Mechanik aktiv)
    // =========================
    /*

    let previousMouse = { x: 0, y: 0 };
    let cameraRotation = { horizontal: 0, vertical: 0 };

    const raycaster = new THREE.Raycaster();
    const mouse2D = new THREE.Vector2();

    function onPointerDown(e) {
      isDragging = true;
      const clientX = e.clientX || e.touches[0].clientX;
      const clientY = e.clientY || e.touches[0].clientY;

      previousMouse.y = clientY;
      
      // Raycasting: Wo im 3D-Raum wird geklickt?
      mouse2D.x = (clientX / 360) * 2 - 1;
      mouse2D.y = -(clientY / 720) * 2 + 1;
      
      raycaster.setFromCamera(mouse2D, camera);
      
      // Intersection mit der π1-Ebene (Y=0)
      const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        clickPointZ = intersect.z;  // Z-Koordinate des Trefferpunkts speichern

    }

    function onPointerUp() {

    */

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
