<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kipp Test - 3x3 Ortho - CUBE BOX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000000;
      overflow: hidden;
      touch-action: none;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }

    #container { 
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 100vh;
    }

    #container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px !important;
      height: 720px !important;
      pointer-events: none;
      z-index: 100;
    }

    #grid-overlay.hidden {
      display: none;
    }

    #grid-overlay line {
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 1;
    }
  </style>
</head>
<body>
  <div id="container">
    <svg id="grid-overlay" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // =========================
    // OPTIK-ONLY: WebP Holzfläche laden
    // =========================
    const WOOD_SRC = 'wuerfelflaeche.webp';
    const woodImg = new Image();
    woodImg.crossOrigin = 'anonymous';
    let woodReady = false;

    let materialsRef = null;
    let faceNumbersRef = null;

    woodImg.onload = () => {
      woodReady = true;
      if (materialsRef && faceNumbersRef) {
        for (let i = 0; i < materialsRef.length; i++) {
          const mat = materialsRef[i];
          if (!mat) continue;
          if (mat.map) mat.map.dispose();
          mat.map = createFaceTexture(faceNumbersRef[i], i);
          mat.needsUpdate = true;
        }
        console.log('✅ Wood WebP geladen – Face-Texturen aktualisiert');
      }
    };
    woodImg.onerror = () => console.warn('⚠️ Holz-WebP nicht geladen → Fallback verwendet');
    woodImg.src = WOOD_SRC;

    // =========================
    // Scene Setup
    // =========================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3f1a14);

    const containerWidth  = 360;
    const containerHeight = 720;
    const aspect = containerWidth / containerHeight;

    const frustumSize = 3.0;   // etwas größer → mehr Platz um den 135-px-Würfel

    const camera = new THREE.OrthographicCamera(
      frustumSize * aspect / -2,
      frustumSize * aspect /  2,
      frustumSize /  2,
      frustumSize / -2,
      0.1, 1000
    );
    camera.position.set(0, 12, 0);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(containerWidth, containerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('container').appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 8, 6);
    scene.add(dirLight);

    // Random Zahlen 1–12
    function createUniqueRandomDeck() {
      const deck = Array.from({length:12}, (_,i)=>i+1);
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    const randomDeck = createUniqueRandomDeck();

    // =========================
    // Face-Textur mit Holz oder Fallback
    // =========================
    function createFaceTexture(numbers, faceIndex) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 426;
      const ctx = canvas.getContext('2d');

      if (woodReady) {
        if (faceIndex === 5) {
          ctx.save();
          ctx.translate(426, 0);
          ctx.rotate(Math.PI / 2);
          ctx.drawImage(woodImg, 0, 0, 426, 426);
          ctx.restore();
        } else {
          ctx.drawImage(woodImg, 0, 0, 426, 426);
        }
      } else {
        const gradient = ctx.createLinearGradient(0,0,426,426);
        gradient.addColorStop(0,   '#d7c2a4');
        gradient.addColorStop(0.5, '#c9b08f');
        gradient.addColorStop(1,   '#d7c2a4');
        ctx.fillStyle = gradient;
        ctx.fillRect(0,0,426,426);
      }

      // 3×3 Gitter
      ctx.strokeStyle = 'rgba(122,74,52,0.4)';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(141,27);  ctx.lineTo(141,399);  ctx.stroke();
      ctx.beginPath(); ctx.moveTo(285,27);  ctx.lineTo(285,399);  ctx.stroke();
      ctx.beginPath(); ctx.moveTo(27,141);  ctx.lineTo(399,141);  ctx.stroke();
      ctx.beginPath(); ctx.moveTo(27,285);  ctx.lineTo(399,285);  ctx.stroke();

      // Zahlen
      ctx.fillStyle = '#2a160c';
      ctx.font = 'bold 80px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const pos = [
        [84,84], [213,84], [342,84],
        [84,213],[213,213],[342,213],
        [84,342],[213,342],[342,342]
      ];

      numbers.forEach((n, i) => {
        if (n === 'X') return;
        const txt = (n === 6 || n === 9) ? n + '.' : String(n);
        ctx.fillText(txt, pos[i][0], pos[i][1]);
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // =========================
    // Slots & Kipp-Logik
    // =========================
    let currentSlots = {
      face5: { S1: randomDeck[2], S2: randomDeck[3], S3: randomDeck[1], S4: randomDeck[0] },
      face2: { S1: randomDeck[6], S2: randomDeck[7], S3: randomDeck[5], S4: randomDeck[4] }
    };

    function swapSlots() {
      for (let face of ['face5','face2']) {
        const old = {...currentSlots[face]};
        currentSlots[face].S3 = old.S1;
        currentSlots[face].S4 = old.S2;
        currentSlots[face].S1 = old.S3;
        currentSlots[face].S2 = old.S4;
      }
    }

    // Face-Definitionen
    const face5_base = [randomDeck[0],'X','X',randomDeck[1],'X','X','X',randomDeck[2],randomDeck[3]];
    const face5_rotated = [face5_base[8],face5_base[7],face5_base[6],face5_base[5],face5_base[4],face5_base[3],face5_base[2],face5_base[1],face5_base[0]];

    const face2_base = [randomDeck[4],'X','X',randomDeck[5],'X','X','X',randomDeck[6],randomDeck[7]];
    const face2_rotated = [face2_base[6],face2_base[3],face2_base[0],face2_base[7],face2_base[4],face2_base[1],face2_base[8],face2_base[5],face2_base[2]];

    const faceNumbers = [
      Array(9).fill('X'),           // 0
      Array(9).fill('X'),           // 1
      face2_rotated,                // 2 (oben nach Kipp)
      Array(9).fill('X'),           // 3
      Array(9).fill('X'),           // 4
      face5_rotated                 // 5 (vorne)
    ];

    const materials = faceNumbers.map((nums, i) =>
      new THREE.MeshStandardMaterial({
        map: createFaceTexture(nums, i),
        roughness: 0.7,
        metalness: 0.1
      })
    );

    materialsRef = materials;
    faceNumbersRef = faceNumbers;

    // Würfel – jetzt Größe 1.5 (≈135 px)
    const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const cube = new THREE.Mesh(geometry, materials);

    const pivotGroup = new THREE.Group();
    scene.add(pivotGroup);

    // =============================================
    // NEUE POSITIONIERUNG – Bottom-Nord auf X-Achse, Bottom-Ost auf Z-Achse
    // =============================================
    // Würfel soll mit seiner Süd-West unteren Ecke genau am Ursprung (0,0,0) liegen
    // → Bottom-Nordkante → entlang positive X
    // → Bottom-Ostkante  → entlang positive Z

    const half = 1.5 / 2;           // 0.75
    cube.position.set( half, half, -half );   // Z negativ → Ostkante auf z=0

    // 45° Drehung um x-Achse (Kippachse bleibt horizontal)
    cube.rotation.x = Math.PI / 4;

    pivotGroup.add(cube);

    // Pivot selbst wird um x-Achse gekippt
    pivotGroup.rotation.x = Math.PI / 4;

    // =============================================
    // Drag / Touch Steuerung (nur vertikal)
    // =============================================
    let isDragging = false;
    let previousY = 0;
    let velocity = 0;

    function pointerDown(e) {
      isDragging = true;
      previousY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
      e.preventDefault();
    }

    function pointerMove(e) {
      if (!isDragging) return;
      const y = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
      const dy = y - previousY;
      velocity = dy * 0.004;
      previousY = y;
      e.preventDefault();
    }

    function pointerUp() {
      isDragging = false;
    }

    const el = renderer.domElement;
    el.addEventListener('mousedown',   pointerDown);
    el.addEventListener('mousemove',   pointerMove);
    el.addEventListener('mouseup',     pointerUp);
    el.addEventListener('mouseleave',  pointerUp);

    el.addEventListener('touchstart',  pointerDown, {passive:false});
    el.addEventListener('touchmove',   pointerMove, {passive:false});
    el.addEventListener('touchend',    pointerUp);
    el.addEventListener('touchcancel', pointerUp);

    // Animation
    let lastRot = pivotGroup.rotation.x;
    let kippDone = false;

    function animate() {
      requestAnimationFrame(animate);

      pivotGroup.rotation.x += velocity;

      const min = -Math.PI/4;
      const max =  Math.PI/4;

      if (pivotGroup.rotation.x < min) {
        pivotGroup.rotation.x = min;
        velocity = 0;
        if (!kippDone && lastRot > min + 0.08) {
          swapSlots();
          kippDone = true;
        }
      }
      if (pivotGroup.rotation.x > max) {
        pivotGroup.rotation.x = max;
        velocity = 0;
        if (!kippDone && lastRot < max - 0.08) {
          swapSlots();
          kippDone = true;
        }
      }

      if (Math.abs(velocity) > 0.008) kippDone = false;

      lastRot = pivotGroup.rotation.x;
      velocity *= 0.94;

      renderer.render(scene, camera);
    }

    animate();

    // =========================
    // Grid-Overlay unverändert
    // =========================
    const grid = document.getElementById('grid-overlay');
    const gs = 45;
    grid.setAttribute('viewBox', `0 0 360 720`);
    grid.setAttribute('width', '360');
    grid.setAttribute('height', '720');

    for (let i = 0; i <= 8; i++) {
      const x = i * gs;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x); line.setAttribute('x2',x);
      line.setAttribute('y1',0); line.setAttribute('y2',720);
      grid.appendChild(line);
    }

    for (let i = 0; i <= 16; i++) {
      const y = i * gs;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',0); line.setAttribute('x2',360);
      line.setAttribute('y1',y); line.setAttribute('y2',y);
      grid.appendChild(line);
    }

    // Achsen
    const xAchs = document.createElementNS('http://www.w3.org/2000/svg','line');
    xAchs.setAttribute('x1',0);   xAchs.setAttribute('x2',360);
    xAchs.setAttribute('y1',270); xAchs.setAttribute('y2',270);
    xAchs.setAttribute('stroke','rgba(255,255,255,0.9)');
    xAchs.setAttribute('stroke-width',2);
    grid.appendChild(xAchs);

    const zAchs = document.createElementNS('http://www.w3.org/2000/svg','line');
    zAchs.setAttribute('x1',180); zAchs.setAttribute('x2',180);
    zAchs.setAttribute('y1',0);   zAchs.setAttribute('y2',720);
    zAchs.setAttribute('stroke','rgba(255,255,255,0.9)');
    zAchs.setAttribute('stroke-width',2);
    grid.appendChild(zAchs);

    document.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'g') {
        grid.classList.toggle('hidden');
      }
    });
  </script>
</body>
</html>
