<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kipp Test - 3x3 Ortho - CUBE BOX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000000;
      overflow: hidden;
      touch-action: none;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }

    #container { 
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 100vh;
    }

    #container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px !important;
      height: 720px !important;
      pointer-events: none;
      z-index: 100;
    }

    #grid-overlay.hidden {
      display: none;
    }

    #grid-overlay line {
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 1;
    }
  </style>
</head>
<body>
  <div id="container">
    <svg id="grid-overlay" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ────────────────────────────────────────────────
    // Holz-Textur (WebP) laden
    // ────────────────────────────────────────────────
    const WOOD_SRC = 'wuerfelflaeche.webp';
    const woodImg = new Image();
    woodImg.crossOrigin = 'anonymous';
    let woodReady = false;

    let materialsRef = null;
    let faceNumbersRef = null;

    woodImg.onload = () => {
      woodReady = true;
      if (materialsRef && faceNumbersRef) {
        for (let i = 0; i < materialsRef.length; i++) {
          const mat = materialsRef[i];
          if (!mat) continue;
          if (mat.map) mat.map.dispose();
          mat.map = createFaceTexture(faceNumbersRef[i], i);
          mat.needsUpdate = true;
        }
      }
    };
    woodImg.onerror = () => console.warn('Holz-WebP nicht geladen → Fallback');
    woodImg.src = WOOD_SRC;

    // ────────────────────────────────────────────────
    // Szene & Kamera – 1 Unit = 45 Pixel
    // ────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3f1a14);

    const containerWidth  = 360;
    const containerHeight = 720;

    const pixelPerUnit = 45;
    const worldWidth  = containerWidth  / pixelPerUnit;  // 8
    const worldHeight = containerHeight / pixelPerUnit;  // 16

    const camera = new THREE.OrthographicCamera(
      worldWidth  / -2,
      worldWidth  /  2,
      worldHeight /  2,
      worldHeight / -2,
      0.1, 1000
    );
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(containerWidth, containerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('container').appendChild(renderer.domElement);

    // Beleuchtung
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(4, 8, 5);
    scene.add(dirLight);

    // ────────────────────────────────────────────────
    // Zufällige Zahlen 1–12
    // ────────────────────────────────────────────────
    function createUniqueRandomDeck() {
      const deck = Array.from({length:12}, (_,i)=>i+1);
      for (let i = deck.length-1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i+1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    const randomDeck = createUniqueRandomDeck();

    // ────────────────────────────────────────────────
    // Face-Textur erstellen
    // ────────────────────────────────────────────────
    function createFaceTexture(numbers, faceIndex) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 426;
      const ctx = canvas.getContext('2d');

      // Hintergrund
      if (woodReady) {
        if (faceIndex === 5) {
          ctx.save();
          ctx.translate(426, 0);
          ctx.rotate(Math.PI / 2);
          ctx.drawImage(woodImg, 0, 0, 426, 426);
          ctx.restore();
        } else {
          ctx.drawImage(woodImg, 0, 0, 426, 426);
        }
      } else {
        const g = ctx.createLinearGradient(0,0,426,426);
        g.addColorStop(0,   '#d7c2a4');
        g.addColorStop(0.5, '#c9b08f');
        g.addColorStop(1,   '#d7c2a4');
        ctx.fillStyle = g;
        ctx.fillRect(0,0,426,426);
      }

      // Gitter
      ctx.strokeStyle = 'rgba(122,74,52,0.4)';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(141,27);  ctx.lineTo(141,399);  ctx.stroke();
      ctx.beginPath(); ctx.moveTo(285,27);  ctx.lineTo(285,399);  ctx.stroke();
      ctx.beginPath(); ctx.moveTo(27,141);  ctx.lineTo(399,141);  ctx.stroke();
      ctx.beginPath(); ctx.moveTo(27,285);  ctx.lineTo(399,285);  ctx.stroke();

      // Zahlen
      ctx.fillStyle = '#2a160c';
      ctx.font = 'bold 80px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const pos = [
        [84,84], [213,84], [342,84],
        [84,213],[213,213],[342,213],
        [84,342],[213,342],[342,342]
      ];

      numbers.forEach((n, i) => {
        if (n === 'X') return;
        const txt = (n===6 || n===9) ? n+'.' : String(n);
        ctx.fillText(txt, pos[i][0], pos[i][1]);
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // ────────────────────────────────────────────────
    // Slots & Kipp-Logik
    // ────────────────────────────────────────────────
    let currentSlots = {
      face5: { S1: randomDeck[2], S2: randomDeck[3], S3: randomDeck[1], S4: randomDeck[0] },
      face2: { S1: randomDeck[6], S2: randomDeck[7], S3: randomDeck[5], S4: randomDeck[4] }
    };

    function swapSlots() {
      ['face5','face2'].forEach(face => {
        const old = {...currentSlots[face]};
        currentSlots[face].S3 = old.S1;
        currentSlots[face].S4 = old.S2;
        currentSlots[face].S1 = old.S3;
        currentSlots[face].S2 = old.S4;
      });
    }

    const face5_base    = [randomDeck[0],'X','X',randomDeck[1],'X','X','X',randomDeck[2],randomDeck[3]];
    const face5_rotated = [face5_base[8],face5_base[7],face5_base[6],face5_base[5],face5_base[4],face5_base[3],face5_base[2],face5_base[1],face5_base[0]];

    const face2_base    = [randomDeck[4],'X','X',randomDeck[5],'X','X','X',randomDeck[6],randomDeck[7]];
    const face2_rotated = [face2_base[6],face2_base[3],face2_base[0],face2_base[7],face2_base[4],face2_base[1],face2_base[8],face2_base[5],face2_base[2]];

    const faceNumbers = [
      Array(9).fill('X'),     // 0
      Array(9).fill('X'),     // 1
      face2_rotated,          // 2
      Array(9).fill('X'),     // 3
      Array(9).fill('X'),     // 4
      face5_rotated           // 5
    ];

    const materials = faceNumbers.map((nums, i) =>
      new THREE.MeshStandardMaterial({
        map: createFaceTexture(nums, i),
        roughness: 0.7,
        metalness: 0.1
      })
    );

    materialsRef = materials;
    faceNumbersRef = faceNumbers;

    // ────────────────────────────────────────────────
    // Würfel – 135 px = 3 Units
    // ────────────────────────────────────────────────
    const cubeSize = 3;

    const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
    const cube = new THREE.Mesh(geometry, materials);

    // Untere Nordkante → x=0    → Würfelmitte x = +1.5
    // Untere Ostkante  → z=0    → Würfelmitte z = -1.5
    // Boden            → y=0    → Würfelmitte y = +1.5
    cube.position.set(cubeSize/2, cubeSize/2, -cubeSize/2);

    cube.rotation.x = Math.PI / 4;

    const pivotGroup = new THREE.Group();
    pivotGroup.add(cube);
    scene.add(pivotGroup);

    pivotGroup.rotation.x = Math.PI / 4;

    // ────────────────────────────────────────────────
    // Drag / Touch
    // ────────────────────────────────────────────────
    let isDragging = false;
    let prevY = 0;
    let velocity = 0;

    function onDown(e) {
      isDragging = true;
      prevY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
      e.preventDefault?.();
    }

    function onMove(e) {
      if (!isDragging) return;
      const y = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
      velocity = (y - prevY) * 0.004;
      prevY = y;
      e.preventDefault?.();
    }

    function onUp() {
      isDragging = false;
    }

    const canvas = renderer.domElement;
    canvas.addEventListener('mousedown',   onDown);
    canvas.addEventListener('mousemove',   onMove);
    canvas.addEventListener('mouseup',     onUp);
    canvas.addEventListener('mouseleave',  onUp);

    canvas.addEventListener('touchstart',  onDown, {passive:false});
    canvas.addEventListener('touchmove',   onMove, {passive:false});
    canvas.addEventListener('touchend',    onUp);
    canvas.addEventListener('touchcancel', onUp);

    // ────────────────────────────────────────────────
    // Animation
    // ────────────────────────────────────────────────
    let lastRot = pivotGroup.rotation.x;
    let kippDone = false;

    function animate() {
      requestAnimationFrame(animate);

      pivotGroup.rotation.x += velocity;

      const minRot = -Math.PI/4;
      const maxRot =  Math.PI/4;

      if (pivotGroup.rotation.x < minRot) {
        pivotGroup.rotation.x = minRot;
        velocity = 0;
        if (!kippDone && lastRot > minRot + 0.08) {
          swapSlots();
          kippDone = true;
        }
      }
      if (pivotGroup.rotation.x > maxRot) {
        pivotGroup.rotation.x = maxRot;
        velocity = 0;
        if (!kippDone && lastRot < maxRot - 0.08) {
          swapSlots();
          kippDone = true;
        }
      }

      if (Math.abs(velocity) > 0.008) kippDone = false;

      lastRot = pivotGroup.rotation.x;
      velocity *= 0.94;

      renderer.render(scene, camera);
    }

    animate();

    // ────────────────────────────────────────────────
    // Grid-Overlay (Debug-Hilfe)
    // ────────────────────────────────────────────────
    const grid = document.getElementById('grid-overlay');
    const gs = 45;
    grid.setAttribute('viewBox', `0 0 360 720`);
    grid.setAttribute('width', '360');
    grid.setAttribute('height', '720');

    // Vertikale Linien
    for (let i = 0; i <= 8; i++) {
      const x = i * gs;
      const l = document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',x); l.setAttribute('x2',x);
      l.setAttribute('y1',0); l.setAttribute('y2',720);
      grid.appendChild(l);
    }

    // Horizontale Linien
    for (let i = 0; i <= 16; i++) {
      const y = i * gs;
      const l = document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',0); l.setAttribute('x2',360);
      l.setAttribute('y1',y); l.setAttribute('y2',y);
      grid.appendChild(l);
    }

    // Achsen hervorheben
    const xAxis = document.createElementNS('http://www.w3.org/2000/svg','line');
    xAxis.setAttribute('x1',0);   xAxis.setAttribute('x2',360);
    xAxis.setAttribute('y1',270); xAxis.setAttribute('y2',270);
    xAxis.setAttribute('stroke','rgba(255,255,255,0.9)');
    xAxis.setAttribute('stroke-width',2);
    grid.appendChild(xAxis);

    const zAxis = document.createElementNS('http://www.w3.org/2000/svg','line');
    zAxis.setAttribute('x1',180); zAxis.setAttribute('x2',180);
    zAxis.setAttribute('y1',0);   zAxis.setAttribute('y2',720);
    zAxis.setAttribute('stroke','rgba(255,255,255,0.9)');
    zAxis.setAttribute('stroke-width',2);
    grid.appendChild(zAxis);

    document.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'g') {
        grid.classList.toggle('hidden');
      }
    });
  </script>
</body>
</html>
