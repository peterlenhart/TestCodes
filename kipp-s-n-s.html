<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kipp Test - 3x3 Ortho - CUBE BOX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000000;
      overflow: hidden;
      touch-action: none;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }

    #container { 
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 100vh;
    }

    #container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px !important;
      height: 720px !important;
      pointer-events: none;
      z-index: 100;
    }

    #grid-overlay.hidden {
      display: none;
    }

    #grid-overlay line {
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 1;
    }
  </style>
</head>
<body>
  <div id="container">
    <svg id="grid-overlay" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // =========================
    // OPTIK-ONLY: WebP Holzfläche laden
    // =========================
    const WOOD_SRC = 'wuerfelflaeche.webp';
    const woodImg = new Image();
    woodImg.crossOrigin = 'anonymous';
    let woodReady = false;

    let materialsRef = null;
    let faceNumbersRef = null;

    woodImg.onload = () => {
      woodReady = true;
      if (materialsRef && faceNumbersRef) {
        for (let i = 0; i < materialsRef.length; i++) {
          const mat = materialsRef[i];
          if (!mat) continue;
          if (mat.map) mat.map.dispose();
          mat.map = createFaceTexture(faceNumbersRef[i], i);
          mat.needsUpdate = true;
        }
        console.log('✅ Wood WebP geladen – Face-Texturen optisch aktualisiert.');
      }
    };
    woodImg.onerror = () => {
      console.warn('⚠️ Holz-WebP konnte nicht geladen werden:', WOOD_SRC);
      console.warn('   → Datei-Pfad/Name prüfen. Fallback-Holz (Gradient) bleibt aktiv.');
    };
    woodImg.src = WOOD_SRC;

    // =========================
    // Scene Setup – zurück zu 1 Unit = 45 px
    // =========================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3f1a14);

    const containerWidth = 360;
    const containerHeight = 720;
    const pixelPerUnit = 45;
    const worldWidth = containerWidth / pixelPerUnit;   // 8
    const worldHeight = containerHeight / pixelPerUnit; // 16

    const camera = new THREE.OrthographicCamera(
      worldWidth / -2,
      worldWidth / 2,
      worldHeight / 2,
      worldHeight / -2,
      0.1, 1000
    );
    camera.position.set(0, 0, 10);          // Original-Kameraseite
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(containerWidth, containerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    function createUniqueRandomDeck() {
      const deck = [];
      for (let i = 1; i <= 12; i++) deck.push(i);
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    const randomDeck = createUniqueRandomDeck();

    function createFaceTexture(numbers, faceIndex) {
      const canvas = document.createElement('canvas');
      canvas.width = 426;
      canvas.height = 426;
      const ctx = canvas.getContext('2d');

      if (woodReady) {
        if (faceIndex === 5) {
          ctx.save();
          ctx.translate(426, 0);
          ctx.rotate(Math.PI / 2);
          ctx.drawImage(woodImg, 0, 0, 426, 426);
          ctx.restore();
        } else {
          ctx.drawImage(woodImg, 0, 0, 426, 426);
        }
      } else {
        const gradient = ctx.createLinearGradient(0, 0, 426, 426);
        gradient.addColorStop(0, '#d7c2a4');
        gradient.addColorStop(0.5, '#c9b08f');
        gradient.addColorStop(1, '#d7c2a4');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 426, 426);

        ctx.strokeStyle = 'rgba(155, 70, 110, 0.08)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 30; i++) {
          ctx.beginPath();
          ctx.moveTo(Math.random() * 426, 0);
          ctx.lineTo(Math.random() * 426, 426);
          ctx.stroke();
        }
      }

      ctx.fillStyle = 'red';
      ctx.font = 'bold 40px system-ui';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`F${faceIndex}`, 10, 10);

      ctx.strokeStyle = 'rgba(122, 74, 52, 0.4)';
      ctx.lineWidth = 4;

      ctx.beginPath(); ctx.moveTo(141, 27); ctx.lineTo(141, 399); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(285, 27); ctx.lineTo(285, 399); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(27, 141); ctx.lineTo(399, 141); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(27, 285); ctx.lineTo(399, 285); ctx.stroke();

      ctx.fillStyle = '#2a160c';
      ctx.font = 'bold 80px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const positions = [
        [84, 84],[213, 84],[342, 84],
        [84, 213],[213, 213],[342, 213],
        [84, 342],[213, 342],[342, 342]
      ];

      numbers.forEach((num, i) => {
        let text;
        if (num === 'X') {
          text = '';
        } else {
          text = (num === 9 || num === 6) ? `${num}.` : String(num);
        }
        ctx.fillText(text, positions[i][0], positions[i][1]);
      });

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    let currentSlots = {
      face5: { S1: randomDeck[2], S2: randomDeck[3], S3: randomDeck[1], S4: randomDeck[0] },
      face2: { S1: randomDeck[6], S2: randomDeck[7], S3: randomDeck[5], S4: randomDeck[4] }
    };

    function swapSlots() {
      for (let face of ['face5', 'face2']) {
        const old = {...currentSlots[face]};
        currentSlots[face].S3 = old.S1;
        currentSlots[face].S4 = old.S2;
        currentSlots[face].S1 = old.S3;
        currentSlots[face].S2 = old.S4;
      }
    }

    const face5_base = [randomDeck[0],'X','X',randomDeck[1],'X','X','X',randomDeck[2],randomDeck[3]];
    const face5_rotated = [face5_base[8],face5_base[7],face5_base[6],face5_base[5],face5_base[4],face5_base[3],face5_base[2],face5_base[1],face5_base[0]];

    const face2_base = [randomDeck[4],'X','X',randomDeck[5],'X','X','X',randomDeck[6],randomDeck[7]];
    const face2_rotated = [face2_base[6],face2_base[3],face2_base[0],face2_base[7],face2_base[4],face2_base[1],face2_base[8],face2_base[5],face2_base[2]];

    const faceNumbers = [
      ['X','X','X','X','X','X','X','X','X'],
      ['X','X','X','X','X','X','X','X','X'],
      face2_rotated,
      ['X','X','X','X','X','X','X','X','X'],
      ['X','X','X','X','X','X','X','X','X'],
      face5_rotated
    ];

    const materials = faceNumbers.map((numbers, index) =>
      new THREE.MeshStandardMaterial({
        map: createFaceTexture(numbers, index),
        roughness: 0.7,
        metalness: 0.1
      })
    );

    materialsRef = materials;
    faceNumbersRef = faceNumbers;

    const geometry = new THREE.BoxGeometry(3, 3, 3);  // 135 px
    const cube = new THREE.Mesh(geometry, materials);

    const pivotGroup = new THREE.Group();
    scene.add(pivotGroup);

    cube.position.x = 1.5;     // Mitte bei x = 1.5 → Ostkante bei z=0
    cube.position.y = 1.5;
    cube.position.z = 1.5;

    cube.rotation.x = Math.PI / 4;
    pivotGroup.add(cube);

    pivotGroup.rotation.x = Math.PI / 4;

    // ─── Nur diese eine Zeile geändert ───
    pivotGroup.position.y = -1;   // eine Rasterzelle nach Süden (y negativ = nach unten im Bild)

    // Drag & Touch (wie in deiner Originalversion)
    let isDragging = false;
    let previousMouseY = 0;
    let rotationVelocity = 0;

    function onMouseDown(e) {
      isDragging = true;
      previousMouseY = e.clientY || e.touches[0].clientY;
    }

    function onMouseMove(e) {
      if (!isDragging) return;
      const currentY = e.clientY || e.touches[0].clientY;
      const deltaY = currentY - previousMouseY;
      rotationVelocity = deltaY * 0.005;
      previousMouseY = currentY;
    }

    function onMouseUp() { isDragging = false; }

    function onTouchStart(e) {
      if (e.touches.length === 1) onMouseDown(e);
    }

    function onTouchMove(e) {
      if (e.touches.length === 1) onMouseMove(e);
    }

    function onTouchEnd(e) {
      if (e.touches.length === 0) isDragging = false;
    }

    renderer.domElement.addEventListener('mousedown', onMouseDown);
    renderer.domElement.addEventListener('mousemove', onMouseMove);
    renderer.domElement.addEventListener('mouseup', onMouseUp);
    renderer.domElement.addEventListener('mouseleave', onMouseUp);

    renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
    renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
    renderer.domElement.addEventListener('touchend', onTouchEnd);

    // Animation (wie original)
    let lastRotation = pivotGroup.rotation.x;
    let kippComplete = false;

    function animate() {
      requestAnimationFrame(animate);

      pivotGroup.rotation.x += rotationVelocity;

      const minRotation = -Math.PI / 4;
      const maxRotation = Math.PI / 4;

      if (pivotGroup.rotation.x < minRotation) {
        pivotGroup.rotation.x = minRotation;
        rotationVelocity = 0;
        if (!kippComplete && lastRotation > minRotation + 0.1) {
          swapSlots();
          kippComplete = true;
        }
      }
      if (pivotGroup.rotation.x > maxRotation) {
        pivotGroup.rotation.x = maxRotation;
        rotationVelocity = 0;
        if (!kippComplete && lastRotation < maxRotation - 0.1) {
          swapSlots();
          kippComplete = true;
        }
      }

      if (Math.abs(rotationVelocity) > 0.01) {
        kippComplete = false;
      }

      lastRotation = pivotGroup.rotation.x;
      rotationVelocity *= 0.95;

      renderer.render(scene, camera);
    }

    animate();

    // Grid Overlay (unverändert)
    const gridOverlay = document.getElementById('grid-overlay');
    const gridSize = 45;
    const gridHeight = 720;

    gridOverlay.setAttribute('viewBox', `0 0 360 ${gridHeight}`);
    gridOverlay.setAttribute('width', '360');
    gridOverlay.setAttribute('height', gridHeight);

    for (let i = 0; i <= 8; i++) {
      const x = i * gridSize;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x);
      line.setAttribute('y1', 0);
      line.setAttribute('x2', x);
      line.setAttribute('y2', gridHeight);
      gridOverlay.appendChild(line);
    }

    const rows = Math.ceil(gridHeight / gridSize);
    for (let i = 0; i <= rows; i++) {
      const y = i * gridSize;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', 0);
      line.setAttribute('y1', y);
      line.setAttribute('x2', 360);
      line.setAttribute('y2', y);
      gridOverlay.appendChild(line);
    }

    const xAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    xAxis.setAttribute('x1', 0);
    xAxis.setAttribute('y1', 270);
    xAxis.setAttribute('x2', 360);
    xAxis.setAttribute('y2', 270);
    xAxis.setAttribute('stroke', 'rgba(255, 255, 255, 0.9)');
    xAxis.setAttribute('stroke-width', '2');
    gridOverlay.appendChild(xAxis);

    const zAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    zAxis.setAttribute('x1', 180);
    zAxis.setAttribute('y1', 0);
    zAxis.setAttribute('x2', 180);
    zAxis.setAttribute('y2', 720);
    zAxis.setAttribute('stroke', 'rgba(255, 255, 255, 0.9)');
    zAxis.setAttribute('stroke-width', '2');
    gridOverlay.appendChild(zAxis);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'g' || e.key === 'G') {
        gridOverlay.classList.toggle('hidden');
      }
    });
  </script>
</body>
</html>
